<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Fitness Coach - Login</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

    <div class="login-page">

        <div class="login-container">


            <!-- =================================================
                 LEFT SIDE
            ================================================== -->

            <div class="login-left">

                <div class="brand-icon">
                    🤖
                </div>

                <h1>
                    AI Fitness Coach
                </h1>

                <p>
                    Your intelligent fitness companion
                    for a healthier and stronger you.
                </p>


                <div class="features">

                    <div class="feature-item">
                        💪
                        <span>
                            Personalized Workout Plans
                        </span>
                    </div>

                    <div class="feature-item">
                        🥗
                        <span>
                            Nutrition Guidance
                        </span>
                    </div>

                    <div class="feature-item">
                        🧮
                        <span>
                            BMI & Calorie Analysis
                        </span>
                    </div>

                    <div class="feature-item">
                        📊
                        <span>
                            Fitness Progress Tracking
                        </span>
                    </div>

                </div>

            </div>


            <!-- =================================================
                 RIGHT SIDE
            ================================================== -->

            <div class="login-right">

                <h2>
                    Welcome Back! 👋
                </h2>

                <p class="subtitle">
                    Login to continue your fitness journey.
                </p>


                <form id="loginForm">


                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-btn"
                        id="loginButton"
                    >
                        Login
                    </button>


                    <!-- MESSAGE -->

                    <div id="loginMessage"></div>

                </form>


                <!-- DIVIDER -->

                <div class="divider">

                    <span>OR</span>

                </div>


                <!-- SIGNUP -->

                <p class="signup-text">

                    Don't have an account?

                    <a href="signup.html">
                        Create Account
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
